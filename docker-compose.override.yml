services:

  backend:
    volumes:
      - ./backend/app.py:/app/app.py
      - ./backend/config.py:/app/config.py
      - ./backend/database.py:/app/database.py
      - ./backend/limiter_instance.py:/app/limiter_instance.py
      - ./backend/middleware:/app/middleware
      - ./backend/models:/app/models
      - ./backend/routes:/app/routes
      - ./backend/services:/app/services
    environment:
      FLASK_APP: app:create_app
    command: ["flask", "run", "--host=0.0.0.0", "--port=8080", "--debug"]

  frontend:
    build:
      target: deps
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_TARGET: http://backend:8080
