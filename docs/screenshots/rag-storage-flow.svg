<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">ENSET AI RAG storage flow</title>
  <desc id="desc">Upload, storage, embedding, retrieval, and response flow for ENSET AI.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#22c55e"/>
    </marker>
    <style>
      .bg { fill: #05070d; }
      .panel { fill: url(#panel); stroke: #263244; stroke-width: 1.5; }
      .title { fill: #f8fafc; font: 700 31px Inter, Arial, sans-serif; }
      .subtitle { fill: #94a3b8; font: 500 16px Inter, Arial, sans-serif; }
      .label { fill: #f8fafc; font: 700 18px Inter, Arial, sans-serif; }
      .body { fill: #aebacd; font: 500 14px Inter, Arial, sans-serif; }
      .tag { fill: #031a18; font: 800 12px Inter, Arial, sans-serif; letter-spacing: 1px; }
      .line { stroke: #22c55e; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .line2 { stroke: #06b6d4; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .accent { fill: #22c55e; }
      .cyan { fill: #06b6d4; }
      .red { fill: #ef4444; }
      .blue { fill: #3b82f6; }
      .muted { fill: #182133; stroke: #334155; stroke-width: 1; }
      .pill { fill: #22c55e; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="640"/>
  <rect x="38" y="38" width="1204" height="564" rx="18" class="panel"/>
  <text x="84" y="94" class="title">ENSET AI RAG Storage Architecture</text>
  <text x="84" y="126" class="subtitle">Postgres keeps metadata, MinIO stores original PDFs, and Qdrant stores reusable embeddings.</text>

  <g transform="translate(84 184)">
    <rect class="muted" width="190" height="110" rx="12"/>
    <circle cx="42" cy="44" r="18" class="blue"/>
    <path d="M36 44h12M42 38v12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="76" y="42" class="label">User Upload</text>
    <text x="76" y="66" class="body">PDF files enter</text>
    <text x="76" y="86" class="body">through Flask API</text>
  </g>

  <path class="line" d="M286 239 H378"/>

  <g transform="translate(390 170)">
    <rect class="muted" width="220" height="138" rx="12"/>
    <rect x="24" y="24" width="42" height="54" rx="5" fill="#0f766e"/>
    <path d="M34 38h22M34 52h22M34 66h14" stroke="#d1fae5" stroke-width="3" stroke-linecap="round"/>
    <text x="82" y="44" class="label">Ingestion</text>
    <text x="82" y="68" class="body">Validate PDF</text>
    <text x="82" y="88" class="body">extract text</text>
    <text x="82" y="108" class="body">split chunks</text>
  </g>

  <path class="line" d="M622 196 C678 166 718 144 770 144"/>
  <path class="line2" d="M622 239 H770"/>
  <path class="line" d="M622 282 C678 316 718 340 770 340"/>

  <g transform="translate(790 92)">
    <rect class="muted" width="310" height="104" rx="12"/>
    <rect x="24" y="26" width="56" height="52" rx="8" class="red"/>
    <text x="38" y="58" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">PDF</text>
    <text x="98" y="42" class="label">MinIO / S3 / R2</text>
    <text x="98" y="66" class="body">Durable original PDFs</text>
    <text x="98" y="86" class="body">outside the app container</text>
  </g>

  <g transform="translate(790 218)">
    <rect class="muted" width="310" height="104" rx="12"/>
    <rect x="24" y="30" width="56" height="44" rx="8" class="accent"/>
    <text x="37" y="58" class="tag">SQL</text>
    <text x="98" y="42" class="label">Postgres</text>
    <text x="98" y="66" class="body">Users, documents, roles</text>
    <text x="98" y="86" class="body">sessions, permissions, audit</text>
  </g>

  <g transform="translate(790 344)">
    <rect class="muted" width="310" height="104" rx="12"/>
    <circle cx="52" cy="52" r="27" class="cyan"/>
    <circle cx="52" cy="52" r="12" fill="#0f172a"/>
    <text x="98" y="42" class="label">Qdrant Vectors</text>
    <text x="98" y="66" class="body">Chunk embeddings for</text>
    <text x="98" y="86" class="body">semantic retrieval</text>
  </g>

  <path class="line2" d="M950 464 C906 514 760 520 656 492"/>
  <path class="line2" d="M790 270 C704 302 664 354 642 438"/>

  <g transform="translate(318 432)">
    <rect class="muted" width="330" height="106" rx="12"/>
    <rect x="24" y="30" width="64" height="46" rx="10" fill="#1e293b" stroke="#22c55e"/>
    <path d="M40 53h32" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
    <text x="106" y="42" class="label">Chat Retrieval</text>
    <text x="106" y="66" class="body">Query embeds once, retrieves</text>
    <text x="106" y="86" class="body">top chunks, streams cited answer</text>
  </g>

  <path class="line" d="M648 485 H770"/>

  <g transform="translate(790 488)">
    <rect class="muted" width="310" height="72" rx="12"/>
    <rect x="24" y="21" width="74" height="30" rx="15" class="pill"/>
    <text x="42" y="41" class="tag">LLM</text>
    <text x="116" y="33" class="label">Answer with citations</text>
    <text x="116" y="55" class="body">Private context stays scoped</text>
  </g>

  <text x="84" y="566" class="subtitle">Local fallback: SQLite + local uploads + ChromaDB. Production path: Postgres + MinIO/S3-compatible storage + Qdrant.</text>
</svg>
