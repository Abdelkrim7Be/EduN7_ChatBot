<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">ENSET AI production RAG storage</title>
  <desc id="desc">Production storage architecture showing application API, metadata database, object storage, vector database, and chat retrieval.</desc>
  <defs>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2 2 L12 7 L2 12 Z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2 2 L12 7 L2 12 Z" fill="#60a5fa"/>
    </marker>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="136%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .page { fill: #070b14; }
      .frame { fill: #0f172a; stroke: #243247; stroke-width: 2; }
      .lane { fill: #111a2b; stroke: #29364c; stroke-width: 1.2; }
      .node { fill: #182235; stroke: #3a4a64; stroke-width: 1.4; filter: url(#shadow); }
      .store { fill: #142033; stroke: #2dd4bf; stroke-width: 1.8; filter: url(#shadow); }
      .vector { fill: #142033; stroke: #60a5fa; stroke-width: 1.8; filter: url(#shadow); }
      text { font-family: Arial, sans-serif; }
      .title { fill: #f8fafc; font-size: 38px; font-weight: 800; }
      .subtitle { fill: #b7c4d8; font-size: 18px; font-weight: 500; }
      .laneText { fill: #9fb0c9; font-size: 14px; font-weight: 700; letter-spacing: 2px; }
      .label { fill: #ffffff; font-size: 24px; font-weight: 800; }
      .body { fill: #cbd5e1; font-size: 17px; font-weight: 500; }
      .small { fill: #94a3b8; font-size: 14px; font-weight: 600; }
      .tag { fill: #041314; font-size: 14px; font-weight: 800; letter-spacing: 1px; }
      .green { stroke: #2dd4bf; stroke-width: 4; fill: none; marker-end: url(#arrowGreen); stroke-linecap: round; stroke-linejoin: round; }
      .blue { stroke: #60a5fa; stroke-width: 4; fill: none; marker-end: url(#arrowBlue); stroke-linecap: round; stroke-linejoin: round; }
      .mutedLine { stroke: #52627c; stroke-width: 2.2; stroke-dasharray: 7 9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .iconGreen { fill: #2dd4bf; }
      .iconBlue { fill: #60a5fa; }
      .iconRed { fill: #f87171; }
      .iconAmber { fill: #fbbf24; }
      .chip { fill: #2dd4bf; }
    </style>
  </defs>

  <rect class="page" width="1440" height="820"/>
  <rect x="50" y="48" width="1340" height="724" rx="22" class="frame"/>

  <text x="94" y="112" class="title">Production RAG Storage</text>
  <text x="94" y="146" class="subtitle">Durable PDFs stay outside the app container. Metadata and vectors scale independently.</text>

  <rect x="94" y="184" width="1252" height="184" rx="14" class="lane"/>
  <text x="124" y="220" class="laneText">UPLOAD AND INGESTION</text>

  <rect x="94" y="396" width="1252" height="148" rx="14" class="lane"/>
  <text x="124" y="432" class="laneText">DURABLE STORAGE</text>

  <rect x="94" y="592" width="1252" height="122" rx="14" class="lane"/>
  <text x="124" y="628" class="laneText">QUESTION ANSWERING</text>

  <g transform="translate(142 244)">
    <rect width="258" height="112" rx="14" class="node"/>
    <circle cx="48" cy="56" r="23" class="iconAmber"/>
    <path d="M48 43v26M35 56h26" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
    <text x="96" y="50" class="label">Upload PDF</text>
    <text x="96" y="80" class="body">Authenticated users</text>
    <text x="96" y="104" class="body">send course files.</text>
  </g>

  <path class="green" d="M416 300 H484"/>

  <g transform="translate(500 244)">
    <rect width="270" height="112" rx="14" class="node"/>
    <rect x="30" y="30" width="48" height="58" rx="8" class="iconGreen"/>
    <path d="M44 46h20M44 61h20M44 76h14" stroke="#06201d" stroke-width="5" stroke-linecap="round"/>
    <text x="104" y="50" class="label">Ingest</text>
    <text x="104" y="80" class="body">Extract text</text>
    <text x="104" y="104" class="body">split clean chunks.</text>
  </g>

  <path class="green" d="M786 280 H854 V250 H946"/>
  <path class="green" d="M786 300 H854 V370 H946"/>
  <path class="blue" d="M786 320 H854 V490 H946"/>

  <g transform="translate(962 204)">
    <rect width="300" height="92" rx="18" class="store"/>
    <rect x="26" y="26" width="54" height="40" rx="9" class="iconRed"/>
    <text x="40" y="52" fill="#111827" font-family="Arial, sans-serif" font-size="15" font-weight="900">PDF</text>
    <text x="104" y="40" class="label">MinIO / S3</text>
    <text x="104" y="68" class="body">Original files</text>
  </g>

  <g transform="translate(962 324)">
    <rect width="300" height="92" rx="18" class="store"/>
    <rect x="26" y="26" width="54" height="40" rx="9" class="chip"/>
    <text x="38" y="52" class="tag">SQL</text>
    <text x="104" y="40" class="label">Postgres</text>
    <text x="104" y="68" class="body">Users and metadata</text>
  </g>

  <g transform="translate(962 444)">
    <rect width="300" height="92" rx="18" class="vector"/>
    <circle cx="54" cy="46" r="27" class="iconBlue"/>
    <circle cx="54" cy="46" r="11" fill="#0f172a"/>
    <text x="104" y="40" class="label">Qdrant</text>
    <text x="104" y="68" class="body">Embeddings index</text>
  </g>

  <path class="mutedLine" d="M962 386 H890 V604 H750 V646"/>
  <path class="mutedLine" d="M962 520 H920 V620 H800 V646"/>

  <g transform="translate(142 646)">
    <rect width="262" height="82" rx="14" class="node"/>
    <circle cx="48" cy="41" r="22" class="iconGreen"/>
    <path d="M37 41h22" stroke="#07211e" stroke-width="5" stroke-linecap="round"/>
    <text x="88" y="38" class="label">Ask</text>
    <text x="88" y="64" class="body">User question</text>
  </g>

  <path class="blue" d="M420 687 H514"/>

  <g transform="translate(530 646)">
    <rect width="300" height="82" rx="14" class="node"/>
    <text x="30" y="38" class="label">Retrieve chunks</text>
    <text x="30" y="64" class="body">Use vectors and permissions.</text>
  </g>

  <path class="green" d="M846 687 H958"/>

  <g transform="translate(974 646)">
    <rect width="288" height="82" rx="14" class="node"/>
    <rect x="26" y="27" width="72" height="30" rx="15" class="chip"/>
    <text x="46" y="47" class="tag">LLM</text>
    <text x="116" y="38" class="label">Answer</text>
    <text x="116" y="64" class="body">Stream with citations.</text>
  </g>

  <text x="94" y="760" class="small">Local mode can use SQLite, local uploads, and ChromaDB. Production mode uses Postgres, MinIO-compatible object storage, and Qdrant.</text>
</svg>
