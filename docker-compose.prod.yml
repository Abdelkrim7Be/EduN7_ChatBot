services:
  chromadb:
    restart: always
    ports: []    # Not exposed externally — only reachable within Docker network

  postgres:
    restart: always
    ports: []    # Not exposed externally — backend uses the Docker network

  qdrant:
    restart: always
    ports: []    # Not exposed externally — backend uses the Docker network

  minio:
    restart: always
    ports: []    # Not exposed externally — backend uses the Docker network

  backend:
    restart: always
    ports: []    # Not exposed externally — nginx proxies through frontend container
    mem_limit: 2g
    environment:
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - ALLOWED_EMAIL_DOMAINS=${ALLOWED_EMAIL_DOMAINS:-}
      - RATE_LIMIT_CHAT=${RATE_LIMIT_CHAT:-30 per hour}
      - RATE_LIMIT_UPLOAD=${RATE_LIMIT_UPLOAD:-20 per day}
      - TRUST_PROXY_HEADERS=true
      - DATABASE_URL=${DATABASE_URL:-postgresql://enset_ai:enset-ai-dev-password@postgres:5432/enset_ai}
      - VECTOR_STORE_BACKEND=${VECTOR_STORE_BACKEND:-qdrant}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - DOCUMENT_STORAGE_BACKEND=${DOCUMENT_STORAGE_BACKEND:-s3}
      - DOCUMENT_STORAGE_PREFIX=${DOCUMENT_STORAGE_PREFIX:-documents}
      - S3_BUCKET=${S3_BUCKET:-enset-ai-documents}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-ensetai}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-ensetai-dev-password}

  frontend:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    mem_limit: 256m
